# Runs when a version tag is pushed. Publishing uses PyPI trusted publishing: a short-lived identity from GitHub, no stored token.
# The steps the owner has to do once on PyPI and GitHub are in docs/release.md.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build, test and check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned tools
        run: python -m pip install --require-hashes -r .github/release/requirements.txt
      - name: The tag must match the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG"
      - name: Test
        run: PYTHONPATH=src python -m pytest -q
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation
      - name: Check the package
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHER == 'true'   # off until the owner has set it up on PyPI: see docs/release.md
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/honestly/
    permissions:
      id-token: write   # the short-lived identity PyPI checks, and what signs the provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

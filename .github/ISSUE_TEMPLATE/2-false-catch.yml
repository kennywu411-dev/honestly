name: "❌ False catch"
description: honestly stopped the agent, but the agent had actually done the thing.
title: "False catch: "
labels: ["false-catch"]
body:
  - type: markdown
    attributes:
      value: |
        Fastest path: run `honestly feedback --issue` and open the pre-filled link it prints. Or paste `honestly feedback` output below.
        It redacts your home path, tokens and e-mail addresses. Please check it before posting.
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options: [Claude Code, Codex, Cursor, Gemini CLI, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: honestly version (`honestly --version`)
  - type: textarea
    id: output
    attributes:
      label: Output of `honestly feedback`
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong, in one line
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Use
      options:
        - label: The redacted text above may be turned into a regression test.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honestly"
version = "0.5.2"
description = "Stops a coding agent from claiming \"tests pass\", \"fixed\", \"sent\" or \"deployed\" without evidence on the transcript. Hooks for Claude Code, Codex, Cursor and Gemini CLI; audits past sessions. Deterministic rules, no model, no API key."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["claude-code", "codex", "cursor", "gemini-cli", "ai-agents", "coding-agents", "hooks", "verification", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kennywu411-dev/honestly"
Repository = "https://github.com/kennywu411-dev/honestly"
Issues = "https://github.com/kennywu411-dev/honestly/issues"

[project.scripts]
honestly = "honestly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

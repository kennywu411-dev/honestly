[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "honestly"
version = "0.7.4"
description = "Blocks a coding agent's \"tests pass\" / \"fixed\" / \"pushed\" reply when no check ran after its last edit. Hooks for Claude Code and Codex (Cursor, Gemini CLI experimental); audits past sessions. Standard-library Python, no model calls."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Wu" }]
dependencies = []
keywords = ["claude-code", "codex", "cursor", "gemini-cli", "ai-agents", "coding-agents", "hooks", "verification", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kennywu411-dev/honestly"
Repository = "https://github.com/kennywu411-dev/honestly"
Issues = "https://github.com/kennywu411-dev/honestly/issues"

[project.scripts]
honestly = "honestly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
